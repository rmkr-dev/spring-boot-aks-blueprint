# Reference only — not applied from this repository.
# Replace `image` with a registry you control after building/pushing the Dockerfile.
# Probes match Spring Boot Actuator when management.endpoint.health.probes.enabled=true
# (see src/main/resources/application.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-aks-blueprint
  labels:
    app.kubernetes.io/name: spring-boot-aks-blueprint
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-aks-blueprint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-boot-aks-blueprint
      annotations:
        # Common Prometheus Operator / scrape annotations (optional; no live scrape claimed)
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: spring-boot-aks-blueprint
      automountServiceAccountToken: false
      # Allow in-flight requests to finish (matches spring.lifecycle.timeout-per-shutdown-phase)
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: spring-boot-aks-blueprint:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: spring-boot-aks-blueprint
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # startupProbe: give the JVM time before liveness starts failing the pod
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Writable scratch for JVM/OS temp files when root FS is read-only
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
