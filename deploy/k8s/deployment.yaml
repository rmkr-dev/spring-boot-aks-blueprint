# Reference only — not applied from this repository.
# Replace `image` with a registry you control after building/pushing the Dockerfile.
# Probes match Spring Boot Actuator when management.endpoint.health.probes.enabled=true
# (see src/main/resources/application.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-aks-blueprint
  labels:
    app.kubernetes.io/name: spring-boot-aks-blueprint
spec:
  replicas: 1
  # Keep a short ReplicaSet history (default is 10)
  revisionHistoryLimit: 5
  # Prefer surge over downtime while the new revision becomes Ready
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Wait after a pod becomes Ready before considering the rollout step done
  minReadySeconds: 10
  # Fail the Deployment condition if a rollout stalls (default is 600s)
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-aks-blueprint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-boot-aks-blueprint
      annotations:
        # Common Prometheus Operator / scrape annotations (optional; no live scrape claimed)
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: spring-boot-aks-blueprint
      automountServiceAccountToken: false
      # 45s > preStop sleep (5s) + spring.lifecycle.timeout-per-shutdown-phase (30s) + JVM exit buffer
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: spring-boot-aks-blueprint
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: spring-boot-aks-blueprint:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: spring-boot-aks-blueprint
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          # startupProbe: give the JVM time before liveness starts failing the pod
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          # Sleep before SIGTERM so kube-proxy can drop endpoints; pair with
          # terminationGracePeriodSeconds (45) > preStop (5) + Spring drain (30).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Writable scratch for JVM/OS temp files when root FS is read-only
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
