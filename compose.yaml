# Local convenience only — builds and runs the Spring Boot app image.
# No database and no fake dependencies. Does not target AKS or kind.
services:
  app:
    build: .
    image: spring-boot-aks-blueprint:compose
    # Align with Dockerfile/Deployment numeric non-root identity
    user: "10001:10001"
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: spring-boot-aks-blueprint
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s
