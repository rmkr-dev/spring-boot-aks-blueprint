name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Verified pin: newest annotated tag on rmkr-dev/gha-reusable-workflows is v0.2.0
# (do not float on @main). Bump deliberately when the reusable contract changes.
jobs:
  test:
    uses: rmkr-dev/gha-reusable-workflows/.github/workflows/java-maven-ci.yml@v0.2.0
    with:
      working-directory: .
      java-version: "21"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image (no push)
        run: docker build -t spring-boot-aks-blueprint:ci .
