name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Verified pin: annotated tag v0.4.0 on rmkr-dev/gha-reusable-workflows
# (compatible java-maven-ci inputs; bump deliberately — do not float on @main).
jobs:
  test:
    uses: rmkr-dev/gha-reusable-workflows/.github/workflows/java-maven-ci.yml@v0.4.0
    with:
      working-directory: .
      java-version: "21"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image (no push)
        run: docker build -t spring-boot-aks-blueprint:ci .
