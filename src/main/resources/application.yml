spring:
  application:
    name: ${SPRING_APPLICATION_NAME:spring-boot-aks-blueprint}
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Must stay below k8s terminationGracePeriodSeconds minus preStop sleep
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  # Drain in-flight requests on SIGTERM (see docs/operations/graceful-shutdown.md)
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 1024
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Boot AKS blueprint sample service
